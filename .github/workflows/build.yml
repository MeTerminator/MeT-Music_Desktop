name: Build and Release App

on:
  workflow_dispatch: # Allows manual trigger from the Actions tab
    inputs:
      tag:
        description: 'Release tag and app version, e.g. 2.3.1 or v2.3.1 (leave blank for a development build)'
        required: false
        type: string
      prerelease:
        description: 'Mark the release as a pre-release'
        required: false
        default: false
        type: boolean
      draft:
        description: 'Create the release as a draft (publish it manually later)'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*' # Version tags (e.g., 2.2.0 or 2.2.0-beta.1)
      - 'v*' # Keep supporting existing version tags

# Grant write permission to the GITHUB_TOKEN to create/update releases
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve Release Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      app-version: ${{ steps.meta.outputs.app_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve Release Tag and App Version
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const ref = process.env.GITHUB_REF;
          const tag = ref.startsWith('refs/tags/')
            ? ref.slice('refs/tags/'.length)
            : process.env.INPUT_TAG.trim() || require('./package.json').version;
          const version = tag.replace(/^v/, '');
          const semver = /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-([0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*))?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?$/;
          const match = semver.exec(version);
          if (!match || match[0] !== version || match[4]?.split('.').some(part => /^0[0-9]+$/.test(part))) {
            throw new Error(`Invalid release version: ${JSON.stringify(tag)}. Use a version like 2.3.1 or v2.3.1-beta.1.`);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\napp_version=${version}\n`);
          console.log(`Release tag: ${tag}, app version: ${version}`);
          NODE

  build:
    name: Build & Package (${{ matrix.os }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Set Packaged App Version
        env:
          APP_VERSION: ${{ needs.version.outputs.app-version }}
        shell: bash
        run: npm pkg set "version=$APP_VERSION"

      - name: Configure macOS Code Signing
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          # Developer ID Application cert exported as .p12, then base64-encoded.
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          # Notarization credentials (Apple ID route).
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$MACOS_CERTIFICATE" ]; then
            CERT_PATH="$RUNNER_TEMP/certificate.p12"
            KEYCHAIN_PATH="$RUNNER_TEMP/metmusic-signing.keychain-db"
            KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
            echo "::add-mask::$KEYCHAIN_PASSWORD"
            printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$CERT_PATH"

            # Use a pre-imported keychain: electron-builder 26.15.3 incorrectly
            # uses the certificate password to unlock its temporary keychain.
            # CSC_LINK must remain unset so it uses CSC_KEYCHAIN directly.
            security list-keychains -d user > "$RUNNER_TEMP/original-keychains.txt"
            KEYCHAINS=()
            while IFS= read -r keychain; do
              KEYCHAINS+=("$keychain")
            done < <(sed -E 's/^[[:space:]]*"//; s/"[[:space:]]*$//' "$RUNNER_TEMP/original-keychains.txt")
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
            security list-keychains -d user -s "$KEYCHAIN_PATH" "${KEYCHAINS[@]}"
            echo "CSC_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
            echo "CSC_IDENTITY_AUTO_DISCOVERY=true" >> "$GITHUB_ENV"
            echo "::notice::macOS code signing enabled"
          else
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "::warning::MACOS_CERTIFICATE not set - shipping an UNSIGNED macOS build"
          fi

          # electron-builder notarizes automatically once these three are present,
          # and throws if only some of them are. All-or-nothing.
          if [ -n "$MACOS_CERTIFICATE" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"
            echo "APPLE_APP_SPECIFIC_PASSWORD=$APPLE_APP_SPECIFIC_PASSWORD" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
            echo "::notice::macOS notarization enabled"
          else
            echo "::warning::Signing certificate or Apple notarization credentials not set - skipping notarization"
          fi

      - name: Build and Package App (macOS)
        if: matrix.os == 'macos-latest'
        run: pnpm run dist:mac --publish never

      - name: Clean Up macOS Code Signing
        if: always() && matrix.os == 'macos-latest'
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/original-keychains.txt" ]; then
            KEYCHAINS=()
            while IFS= read -r keychain; do
              KEYCHAINS+=("$keychain")
            done < <(sed -E 's/^[[:space:]]*"//; s/"[[:space:]]*$//' "$RUNNER_TEMP/original-keychains.txt")
            security list-keychains -d user -s "${KEYCHAINS[@]}"
          fi
          if [ -f "$RUNNER_TEMP/metmusic-signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/metmusic-signing.keychain-db"
          fi
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/original-keychains.txt"

      - name: Build and Package App (Windows)
        if: matrix.os == 'windows-latest'
        run: pnpm run dist:win --publish never
        shell: bash

      - name: Build and Package App (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: pnpm run dist:linux --publish never

      - name: Upload Artifacts to Action Run
        uses: actions/upload-artifact@v4
        with:
          name: metmusic-desktop-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage
            dist/latest*.yml
            dist/*.blockmap
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [version, build]
    if: needs.version.outputs.app-version != '0.0.0-dev'
    runs-on: ubuntu-latest

    steps:
      - name: Download All Build Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: metmusic-desktop-*
          path: release-assets
          merge-multiple: true

      - name: List Collected Assets
        run: ls -lh release-assets

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          draft: ${{ inputs.draft == true }}
          prerelease: ${{ inputs.prerelease == true }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
